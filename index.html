<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上互動刮刮樂 APP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .scratch-card-grid {
            display: grid;
            gap: 12px;
            margin: 0 auto;
            max-width: 420px;
        }
        .scratch-cell {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            user-select: none;
            -webkit-user-select: none;
        }
        .prize-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 2px solid #f59e0b;
            border-radius: 12px;
        }
        .canvas-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800/80 backdrop-blur sticky top-0 z-50 border-b border-slate-700">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-ticket text-amber-400 text-xl"></i>
                <span class="font-bold text-lg text-white">線上刮刮樂抽獎系統</span>
            </div>
            <div class="flex space-x-2">
                <button id="btn-view-admin" onclick="switchView('admin')" class="px-3 py-1.5 rounded-lg text-sm font-medium transition bg-amber-500 text-slate-950 font-bold hover:bg-amber-400">
                    <i class="fa-solid fa-gear mr-1"></i> 店家後台
                </button>
                <button id="btn-view-customer" onclick="switchView('customer')" class="px-3 py-1.5 rounded-lg text-sm font-medium transition bg-slate-700 text-slate-200 hover:bg-slate-600">
                    <i class="fa-solid fa-mobile-screen mr-1"></i> 顧客視角
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6">

        <!-- ================= 後台管理頁面 ================= -->
        <section id="admin-view" class="space-y-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-amber-400 flex items-center">
                    <i class="fa-solid fa-sliders mr-2"></i> 刮刮樂活動內容設定
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-300">活動名稱</label>
                        <input type="text" id="cfg-title" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400" value="🎉 樂活限定！幸運大刮刮樂">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-300">限制可刮次數（每人）</label>
                        <input type="number" id="cfg-max-scratches" min="1" max="9" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400" value="3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-300">網格排列方式</label>
                        <select id="cfg-grid-size" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400">
                            <option value="3">3 x 3 網格 ( 9 格 )</option>
                            <option value="2">2 x 2 網格 ( 4 格 )</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-300">刮卡銀漆顏色</label>
                        <select id="cfg-coat-color" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400">
                            <option value="#a1a1aa">經典銀金屬漆</option>
                            <option value="#f59e0b">尊爵耀眼金</option>
                            <option value="#3b82f6">炫彩寶石藍</option>
                        </select>
                    </div>
                </div>

                <!-- 獎項設定清單 -->
                <div class="mt-6">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-medium text-slate-300">獎項設定（項目與獎項文字）</label>
                        <button onclick="addPrizeRow()" class="text-xs bg-slate-700 hover:bg-slate-600 text-amber-300 px-2.5 py-1 rounded-lg transition">
                            <i class="fa-solid fa-plus mr-1"></i> 新增獎項
                        </button>
                    </div>
                    <div id="prize-list" class="space-y-2">
                        <!-- 動態生成獎項欄位 -->
                    </div>
                </div>

                <div class="mt-6 flex flex-wrap gap-3">
                    <button onclick="saveAndGenerate()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl transition shadow-lg flex items-center">
                        <i class="fa-solid fa-qrcode mr-2"></i> 儲存並更新 QR Code
                    </button>
                </div>
            </div>

            <!-- QR Code 與網址生成結果 -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-col md:flex-row items-center gap-6">
                <div class="bg-white p-3 rounded-xl shadow-inner border" id="qrcode-box">
                    <div id="qrcode"></div>
                </div>
                <div class="flex-1 space-y-3 text-center md:text-left">
                    <h3 class="text-lg font-bold text-white flex items-center justify-center md:justify-start">
                        <i class="fa-solid fa-share-nodes text-amber-400 mr-2"></i> 專屬 QR Code 與客戶端連結
                    </h3>
                    <p class="text-xs text-slate-400">將此 QR Code 列印或置於櫃檯，客人使用手機掃描即可進入專屬刮刮樂頁面。</p>
                    <div class="flex items-center space-x-2">
                        <input type="text" id="share-url" readonly class="flex-1 bg-slate-900 border border-slate-700 text-slate-300 px-3 py-2 rounded-lg text-xs font-mono select-all">
                        <button onclick="copyShareUrl()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium text-amber-400 transition">
                            <i class="fa-solid fa-copy mr-1"></i> 複製
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= 顧客刮刮樂體驗頁面 ================= -->
        <section id="customer-view" class="hidden space-y-4">
            <div class="text-center space-y-1">
                <h1 id="disp-title" class="text-2xl md:text-3xl font-extrabold text-amber-400">🎉 樂活限定！幸運大刮刮樂</h1>
                <p class="text-xs md:text-sm text-slate-400">用手指塗抹刮開銀漆，驚喜好禮等你拿！</p>
            </div>

            <!-- 剩餘次數顯示區 -->
            <div class="bg-slate-800/90 max-w-sm mx-auto p-3 rounded-xl border border-slate-700 flex justify-between items-center px-6 shadow-md">
                <span class="text-sm font-medium text-slate-300">剩餘可刮次數</span>
                <span class="text-xl font-black text-amber-400" id="disp-remaining-scratches">3</span>
            </div>

            <!-- 刮刮樂網格 -->
            <div id="scratch-grid-container" class="scratch-card-grid"></div>

            <div class="text-center pt-2">
                <button onclick="resetCustomerView()" class="text-xs text-slate-400 underline hover:text-amber-400 transition">
                    <i class="fa-solid fa-rotate-left mr-1"></i> 重置試刮 (展示用)
                </button>
            </div>
        </section>

    </main>

    <!-- 中獎結果彈窗 -->
    <div id="result-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-amber-500/50 p-6 md:p-8 rounded-2xl max-w-sm w-full text-center space-y-4 shadow-2xl transform transition-all">
            <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-3xl">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h3 class="text-xl font-bold text-white">恭喜完成刮獎！</h3>
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700 text-amber-300 text-sm font-bold space-y-1" id="modal-prize-summary">
                <!-- 動態填入刮中結果 -->
            </div>
            <p class="text-xs text-slate-400">請向工作人員出示此畫面領取您的專屬優惠！</p>
            <button onclick="closeModal()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl transition">
                確定領取
            </button>
        </div>
    </div>

    <script>
        // 預設活動設定
        let appConfig = {
            title: "🎉 樂活限定！幸運大刮刮樂",
            maxScratches: 3,
            gridSize: 3,
            coatColor: "#a1a1aa",
            prizes: [
                "🎉 一等獎：免費禮券 $1000",
                "🎁 二等獎：精美小禮物乙份",
                "🥤 三等獎：飲品買一送一券",
                "銘謝惠顧 🍀 祝您下次中獎",
                "☕ 驚喜獎：免費研磨咖啡乙杯",
                "銘謝惠顧 🍀 祝您下次中獎",
                "🍦 折價券：冰淇淋折 20 元",
                "銘謝惠顧 🍀 祝您下次中獎",
                "🎁 二等獎：精美小禮物乙份"
            ]
        };

        let currentScratchedCount = 0;
        let qrCodeInstance = null;
        let cellStates = [];

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadConfigFromURL();
            initAdminInputs();
            renderPrizeRows();
            generateQRCode();
            initCustomerView();
        });

        // 導覽檢視切換
        function switchView(view) {
            const adminSec = document.getElementById('admin-view');
            const custSec = document.getElementById('customer-view');
            const btnAdmin = document.getElementById('btn-view-admin');
            const btnCust = document.getElementById('btn-view-customer');

            if (view === 'admin') {
                adminSec.classList.remove('hidden');
                custSec.classList.add('hidden');
                btnAdmin.className = "px-3 py-1.5 rounded-lg text-sm font-medium transition bg-amber-500 text-slate-950 font-bold hover:bg-amber-400";
                btnCust.className = "px-3 py-1.5 rounded-lg text-sm font-medium transition bg-slate-700 text-slate-200 hover:bg-slate-600";
            } else {
                adminSec.classList.add('hidden');
                custSec.classList.remove('hidden');
                btnCust.className = "px-3 py-1.5 rounded-lg text-sm font-medium transition bg-amber-500 text-slate-950 font-bold hover:bg-amber-400";
                btnAdmin.className = "px-3 py-1.5 rounded-lg text-sm font-medium transition bg-slate-700 text-slate-200 hover:bg-slate-600";
                initCustomerView();
            }
        }

        // 後台輸入控制
        function initAdminInputs() {
            document.getElementById('cfg-title').value = appConfig.title;
            document.getElementById('cfg-max-scratches').value = appConfig.maxScratches;
            document.getElementById('cfg-grid-size').value = appConfig.gridSize;
            document.getElementById('cfg-coat-color').value = appConfig.coatColor;
        }

        function renderPrizeRows() {
            const list = document.getElementById('prize-list');
            list.innerHTML = '';
            appConfig.prizes.forEach((prize, idx) => {
                const row = document.createElement('div');
                row.className = "flex items-center space-x-2";
                row.innerHTML = `
                    <span class="text-xs text-slate-400 font-mono w-6">#${idx + 1}</span>
                    <input type="text" value="${prize}" onchange="updatePrize(${idx}, this.value)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400">
                    <button onclick="removePrizeRow(${idx})" class="text-rose-400 hover:text-rose-300 p-1.5"><i class="fa-solid fa-trash"></i></button>
                `;
                list.appendChild(row);
            });
        }

        function addPrizeRow() {
            appConfig.prizes.push("銘謝惠顧 🍀 祝您下次中獎");
            renderPrizeRows();
        }

        function removePrizeRow(idx) {
            if (appConfig.prizes.length <= 1) return alert("至少需保留一個獎項！");
            appConfig.prizes.splice(idx, 1);
            renderPrizeRows();
        }

        function updatePrize(idx, val) {
            appConfig.prizes[idx] = val;
        }

        // 儲存並重新產生網址與 QR Code
        function saveAndGenerate() {
            appConfig.title = document.getElementById('cfg-title').value.trim();
            appConfig.maxScratches = parseInt(document.getElementById('cfg-max-scratches').value) || 1;
            appConfig.gridSize = parseInt(document.getElementById('cfg-grid-size').value) || 3;
            appConfig.coatColor = document.getElementById('cfg-coat-color').value;

            generateQRCode();
            alert("✅ 活動設定已成功儲存並同步至 QR Code！");
        }

        function generateQRCode() {
            // 將設定編碼至 URL Hash
            const encodedData = encodeURIComponent(JSON.stringify(appConfig));
            const shareUrl = `${window.location.origin}${window.location.pathname}#game=${encodedData}`;
            
            document.getElementById('share-url').value = shareUrl;

            const qrBox = document.getElementById('qrcode');
            qrBox.innerHTML = '';
            qrCodeInstance = new QRCode(qrBox, {
                text: shareUrl,
                width: 160,
                height: 160,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
        }

        function loadConfigFromURL() {
            if (window.location.hash.startsWith('#game=')) {
                try {
                    const raw = window.location.hash.replace('#game=', '');
                    const parsed = JSON.parse(decodeURIComponent(raw));
                    if (parsed && parsed.prizes) {
                        appConfig = parsed;
                        switchView('customer');
                    }
                } catch(e) {
                    console.error("解析 URL 設定失敗", e);
                }
            }
        }

        function copyShareUrl() {
            const input = document.getElementById('share-url');
            input.select();
            document.execCommand('copy');
            alert("📋 刮刮樂連結已複製到剪貼簿！");
        }

        // 渲染顧客刮刮卡
        function initCustomerView() {
            document.getElementById('disp-title').innerText = appConfig.title;
            document.getElementById('disp-remaining-scratches').innerText = appConfig.maxScratches;
            currentScratchedCount = 0;
            cellStates = [];

            const container = document.getElementById('scratch-grid-container');
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${appConfig.gridSize}, minmax(0, 1fr))`;

            const totalCells = appConfig.gridSize * appConfig.gridSize;

            for (let i = 0; i < totalCells; i++) {
                const prizeText = appConfig.prizes[i % appConfig.prizes.length];
                cellStates.push({ revealed: false, prize: prizeText });

                const cell = document.createElement('div');
                cell.className = 'scratch-cell';

                // 底層：獎項內容
                const prizeLayer = document.createElement('div');
                prizeLayer.className = 'prize-layer';
                prizeLayer.innerHTML = `
                    <i class="fa-solid fa-gift text-amber-500 text-lg mb-1"></i>
                    <span class="text-xs font-bold text-slate-800 leading-tight">${prizeText}</span>
                `;

                // 上層：Canvas 銀漆
                const canvas = document.createElement('canvas');
                canvas.className = 'canvas-layer';
                
                cell.appendChild(prizeLayer);
                cell.appendChild(canvas);
                container.appendChild(cell);

                // 設定 Canvas 塗層
                setupScratchCanvas(canvas, i);
            }
        }

        function setupScratchCanvas(canvas, index) {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width || 120;
            canvas.height = rect.height || 120;
            const ctx = canvas.getContext('2d');

            // 繪製銀漆底色與文字提示
            ctx.fillStyle = appConfig.coatColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.font = "bold 14px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("刮開此處", canvas.width / 2, canvas.height / 2);

            let isDrawing = false;

            function getPos(e) {
                const b = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - b.left, y: clientY - b.top };
            }

            function scratch(e) {
                if (!isDrawing || cellStates[index].revealed) return;
                
                // 檢查是否超過允許的總刮數
                if (currentScratchedCount >= appConfig.maxScratches) {
                    alert(`您最多只能刮 ${appConfig.maxScratches} 次喔！`);
                    isDrawing = false;
                    return;
                }

                const pos = getPos(e);
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 16, 0, Math.PI * 2);
                ctx.fill();

                checkScratchPercentage(canvas, index);
            }

            canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
            canvas.addEventListener('mousemove', scratch);
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); e.preventDefault(); });
            canvas.addEventListener('touchmove', (e) => { scratch(e); e.preventDefault(); });
            canvas.addEventListener('touchend', () => isDrawing = false);
        }

        function checkScratchPercentage(canvas, index) {
            if (cellStates[index].revealed) return;

            const ctx = canvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let clearPixels = 0;
            for (let i = 3; i < imgData.data.length; i += 4) {
                if (imgData.data[i] === 0) clearPixels++;
            }

            // 刮開比例超過 35% 自動完全露出
            if (clearPixels / (canvas.width * canvas.height) > 0.35) {
                cellStates[index].revealed = true;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                currentScratchedCount++;
                const remaining = Math.max(0, appConfig.maxScratches - currentScratchedCount);
                document.getElementById('disp-remaining-scratches').innerText = remaining;

                // 若達上限，顯示最終結果彈窗與彩帶
                if (currentScratchedCount >= appConfig.maxScratches) {
                    setTimeout(showResultModal, 500);
                }
            }
        }

        function showResultModal() {
            const summaryBox = document.getElementById('modal-prize-summary');
            summaryBox.innerHTML = '';
            
            const wonItems = cellStates.filter(c => c.revealed);
            wonItems.forEach((item, idx) => {
                const d = document.createElement('div');
                d.innerText = `第 ${idx + 1} 抽：${item.prize}`;
                summaryBox.appendChild(d);
            });

            document.getElementById('result-modal').classList.remove('hidden');

            // 觸發全螢幕彩帶
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function closeModal() {
            document.getElementById('result-modal').classList.add('hidden');
        }

        function resetCustomerView() {
            initCustomerView();
        }
    </script>
</body>
</html>
